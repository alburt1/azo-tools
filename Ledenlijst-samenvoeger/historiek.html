<div class="hub-hero" style="padding:44px 24px;">
  <h1 style="text-align:center;font-size:26px;">Bewaarde samenvoegingen</h1>
  <p style="text-align:center;color:var(--ink-soft);max-width:560px;margin:8px auto 0;">

  </div>
</div>

<script>
function escHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleString('nl-BE', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
}

// Zelfde opmaak-functie als in de tool zelf: groene kop, dikke buitenrand,
// Bron-kolom in blauw/groen naargelang de herkomst.
async function downloadRow(row){
  const GREEN = 'FF4C7527', GREEN_DARK = 'FF31491A', INK = 'FF20241F';
  const BLUE = 'FF3A6A8A', BLUE_BG = 'FFE8F0F4', GREEN_TXT = 'FF4C7527', GREEN_BG = 'FFE9F2E0', LIGHT_STRIPE = 'FFEAF1E3';
  const AMBER_TXT = 'FF9C6B12', AMBER_BG = 'FFFCEFD1';
  const thin = {style:'thin', color:{argb:'FFB9C2AC'}};
  const medium = {style:'medium', color:{argb:GREEN_DARK}};

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Samengevoegde lijst');
  ws.columns = [{header:'Naam', key:'naam', width:60},{header:'Gemeente', key:'gemeente', width:28},{header:'Bron', key:'bron', width:22}];

  const headerRow = ws.getRow(1);
  headerRow.height = 22;
  headerRow.eachCell(cell=>{
    cell.font = {name:'Arial', bold:true, size:11, color:{argb:'FFFFFFFF'}};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:GREEN}};
    cell.alignment = {vertical:'middle', horizontal: cell.col===1 ? 'left' : 'center'};
    cell.border = {top:medium, bottom:medium, left:medium, right:medium};
  });

  const data = row.result_data || [];
  data.forEach((x, i)=>{
    let bronText, bronColor, bronFill;
    if(x.src === 'BOTH'){ bronText='Koepellijst & AZO-lijst'; bronColor=AMBER_TXT; bronFill=AMBER_BG; }
    else if(x.src === 'A'){ bronText='Koepellijst'; bronColor=BLUE; bronFill=BLUE_BG; }
    else { bronText='AZO-lijst'; bronColor=GREEN_TXT; bronFill=GREEN_BG; }
    const isEven = (i % 2 === 1);
    const dRow = ws.addRow({naam:x.name, gemeente:x.city||'', bron: bronText});
    dRow.eachCell((cell, colNumber)=>{
      const isBronCol = colNumber===3;
      cell.font = {name:'Arial', size:10, color:{argb: isBronCol ? bronColor : INK}, bold: isBronCol};
      cell.alignment = {vertical:'middle', horizontal: colNumber===1 ? 'left' : 'center'};
      cell.border = {top:thin, bottom:thin, left:thin, right:thin};
      if(isBronCol){ cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb: bronFill}}; }
      else if(isEven){ cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb: LIGHT_STRIPE}}; }
    });
  });
  ws.views = [{state:'frozen', ySplit:1, showGridLines:false}];

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date(row.created_at).toISOString().slice(0,10);
  a.href = url;
  a.download = `Samengevoegde_ledenlijst_${dateStr}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function loadHistory(){
  const wrap = document.getElementById('listWrap');
  const { data, error } = await supabaseClient
    .from('merged_lists')
    .select('id,user_email,azo_filename,total_count,unique_added_count,auto_merged_count,reviewed_count,threshold,created_at,result_data')
    .order('created_at', {ascending:false})
    .limit(100);

  if(error){
    wrap.innerHTML = `<div style="background:#fdf2ee;border:1px solid #e6b8a8;border-radius:var(--radius-sm);padding:16px;color:#a6432a;font-size:13px;">
      Kon de historiek niet laden: ${escHtml(error.message)}</div>`;
    return;
  }
  if(!data || data.length===0){
    wrap.innerHTML = `<p style="color:var(--ink-faint);font-size:13px;">Nog geen samenvoegingen bewaard. Zodra iemand een samengevoegde lijst downloadt, verschijnt die hier.</p>`;
    return;
  }

  wrap.innerHTML = data.map((r, idx) => `
    <div style="background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
      <div>
        <div style="font-weight:700;font-size:14px;margin-bottom:4px;">${escHtml(r.azo_filename || 'Ledenlijst')}</div>
        <div style="font-size:12px;color:var(--ink-faint);">
          ${fmtDate(r.created_at)} — door ${escHtml(r.user_email)}<br>
          ${r.total_count ?? '?'} totaal · ${r.unique_added_count ?? '?'} nieuw toegevoegd · ${r.auto_merged_count ?? '?'} dubbels · ${r.reviewed_count ?? '?'} twijfelgevallen
          ${r.threshold ? ` · drempel ${r.threshold}%` : ''}
        </div>
      </div>
      <button data-idx="${idx}" class="btn-download-row" style="flex:none;background:var(--azo-green-dark);color:#fff;border:none;padding:10px 16px;border-radius:20px;font-weight:700;font-size:12.5px;cursor:pointer;">
        ⬇ Download
      </button>
    </div>
  `).join('');

  wrap.querySelectorAll('.btn-download-row').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = parseInt(btn.dataset.idx);
      btn.textContent = 'Bezig…';
      btn.disabled = true;
      await downloadRow(data[idx]);
      btn.textContent = '⬇ Download';
      btn.disabled = false;
    });
  });
}

(async () => {
  await requireAuth();
  loadHistory();
})();
</script>

</body>
